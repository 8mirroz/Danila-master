version: '3.8'

services:
  hermes:
    image: nousresearch/hermes-agent:v2026.7.20
    restart: unless-stopped
    command: ["hermes", "--profile", "partsops", "gateway", "run", "--force", "--no-supervise"]
    environment:
      - API_SERVER_ENABLED=1
      - API_SERVER_KEY=${HERMES_API_KEY:?HERMES_API_KEY must be provided}
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - HERMES_PROFILE=partsops
    volumes:
      - hermes_data:/root/.hermes
      - ./partsops-hermes:/root/.hermes/profiles/partsops
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer $$API_SERVER_KEY' http://localhost:8642/v1/capabilities"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PARTSOPS_API_TOKEN=${PARTSOPS_API_TOKEN:-test-token}
      - PARTSOPS_CORS_ORIGINS=${PARTSOPS_CORS_ORIGINS:-http://localhost:5173,http://localhost:5176}
      - HERMES_API_URL=http://hermes:8642
      - HERMES_API_KEY=${HERMES_API_KEY:?HERMES_API_KEY must be provided}
      # local compose default is demo-friendly; override TESTING=0 for STAGE-like runs
      - TESTING=${TESTING:-1}
      - SEED_ON_START=${SEED_ON_START:-1}
      - PARTSOPS_ENV=${PARTSOPS_ENV:-dev}
      - DATABASE_URL=${DATABASE_URL:-}
    depends_on:
      hermes:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Durable Kanban pipeline consumer (optional profile)
  pipeline-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    profiles:
      - worker
    command: ["python", "-m", "app.automation.pipeline_worker", "--poll-seconds", "1"]
    environment:
      - PARTSOPS_API_TOKEN=${PARTSOPS_API_TOKEN:-test-token}
      - HERMES_API_URL=http://hermes:8642
      - HERMES_API_KEY=${HERMES_API_KEY:?HERMES_API_KEY must be provided}
      - TESTING=${TESTING:-1}
      - DATABASE_URL=${DATABASE_URL:-}
      - PARTSOPS_PIPELINE_WORKER_ID=${PARTSOPS_PIPELINE_WORKER_ID:-compose-worker-1}
      - PYTHONPATH=/app
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - .:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_PARTSOPS_TENANT_ID=default
      - VITE_PARTSOPS_API_TOKEN=test-token

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=partsops
      - POSTGRES_USER=partsops
      - POSTGRES_PASSWORD=partsops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    profiles:
      - postgres

volumes:
  postgres_data:
  hermes_data:
