version: '3.8'

services:
  hermes:
    image: nousresearch/hermes-agent:v2026.7.20
    restart: unless-stopped
    command: ["hermes", "serve", "--profile", "partsops", "--host", "0.0.0.0", "--port", "8642", "--isolated"]
    environment:
      - API_SERVER_KEY=${HERMES_API_KEY:-partsops-hermes-secret-key}
      - HERMES_PROFILE=partsops
    volumes:
      - hermes_data:/root/.hermes
      - ./partsops-hermes:/root/.hermes/profiles/partsops
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PARTSOPS_API_TOKEN=${PARTSOPS_API_TOKEN:-test-token}
      - PARTSOPS_CORS_ORIGINS=${PARTSOPS_CORS_ORIGINS:-http://localhost:5173,http://localhost:5176}
      - HERMES_API_URL=http://hermes:8642
      - HERMES_API_KEY=${HERMES_API_KEY:-partsops-hermes-secret-key}
      - TESTING=1
    depends_on:
      hermes:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_PARTSOPS_TENANT_ID=default
      - VITE_PARTSOPS_API_TOKEN=test-token

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=partsops
      - POSTGRES_USER=partsops
      - POSTGRES_PASSWORD=partsops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    profiles:
      - postgres

volumes:
  postgres_data:
  hermes_data: