name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PARTSOPS_API_TOKEN: test-token
  TESTING: 1

jobs:
  # Backend tests
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./partsops-ai-manager

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        run: |
          python -m pytest tests/test_api.py tests/test_events.py tests/test_state_machine.py tests/test_rbac_isolation.py tests/test_observability.py tests/test_saas_foundation.py tests/test_oidc_rbac.py tests/test_keycloak_realm.py tests/test_learning.py tests/test_rfq_imports.py tests/test_outbound_webhook.py tests/test_quotes.py tests/test_s3_storage.py tests/test_service_api_keys.py tests/test_quoteops_analytics.py -v

      - name: Verify migrations round trip
        run: |
          export DATABASE_URL="sqlite:///${RUNNER_TEMP}/partsops-migrations.db"
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Run SaaS backend lint
        run: |
          pip install ruff
          ruff check app/automation/storage.py rbac.py routers/analytics.py routers/erp.py routers/integrations.py routers/saas.py routers/rfq_imports.py routers/quotes.py services/quoteops_analytics.py services/service_api_keys.py services/saas.py services/rfq_imports.py services/quotes.py services/pipeline_runs.py --select=E,F,W,I --ignore=E501

  # Frontend tests
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./partsops-ai-manager/06_UI/admin_cockpit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Run build
        run: npm run build

      - name: Run frontend lint
        run: npm run lint

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start backend for E2E
        run: |
          cd ../..
          source venv/bin/activate 2>/dev/null || python -m venv venv && source venv/bin/activate && pip install -r requirements.txt
          export PARTSOPS_API_TOKEN=test-token
          export TESTING=1
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/ || exit 1

      - name: Run Playwright tests
        run: npx playwright test --reporter=line
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5176

  # Docker build
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: partsops-backend:latest
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: partsops-frontend:latest
          load: true

  # Deploy (placeholder)
  deploy:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "Deploy to production - configure your deployment target here"
          # Example: kubectl apply, docker compose up -d, etc.
