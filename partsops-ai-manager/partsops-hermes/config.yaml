# PartsOps Hermes Profile Configuration
model:
  # NVIDIA NIM primary: strong Russian operational responses, streaming,
  # structured output, and tool-use support without exposing provider secrets.
  provider: nvidia
  name: z-ai/glm-5.2

# Ordered NIM-only failover chain. Hermes tries the next entry only after the
# current provider returns a retryable/auth/availability failure; accepted runs
# are never replayed by the PartsOps broker.
fallback_providers:
  # Frontier reasoning / agentic reserve.
  - provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
  # Models supplied in the NVIDIA NIM package, ordered by operational reserve
  # value and expected response speed.
  - provider: nvidia
    model: deepseek-ai/deepseek-v4-flash
  - provider: nvidia
    model: stepfun-ai/step-3.7-flash
  - provider: nvidia
    model: minimaxai/minimax-m3
  - provider: nvidia
    model: deepseek-ai/deepseek-v4-pro
  - provider: nvidia
    model: poolside/laguna-xs-2.1
  - provider: nvidia
    model: nvidia/ising-calibration-1.5-31b
  # NVIDIA catalog currently exposes this ID, but its completion endpoint can
  # reject requests; keep it last as an experimental reserve.
  - provider: nvidia
    model: moonshotai/kimi-k2.6
  # Existing stable NIM reserve retained after the supplied candidates.
  - provider: nvidia
    model: meta/llama-3.3-70b-instruct

platforms:
  api_server:
    enabled: true
  telegram:
    enabled: false
  slack:
    enabled: false

partsops_policy:
  reasoning: low
  max_agent_iterations: 8
  single_provider_attempt: true
  max_input_chars: 4000
  max_history_turns: 12
  max_output_tokens: 1000
  timeout_seconds: 45

tenant_limits:
  rate_limit_rpm: 10
  max_concurrent_runs: 2
  daily_budget_usd: 10.0
  budget_warning_threshold: 0.8
  history_retention_days: 30
