services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-partsops}
      POSTGRES_USER: ${POSTGRES_USER:-partsops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}
    ports:
      # Avoid clashing with a developer's local PostgreSQL while remaining loopback-only.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set in .env.staging}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env.staging}
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_PORT=8080
      # Keep issued access-token issuer stable for the browser-facing staging URL.
      - KC_HOSTNAME=localhost
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./01_CONFIGS/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; IFS= read -r task_line <&3; [[ \"$$task_line\" == *\"200 OK\"* ]]'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env.staging}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env.staging}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_staging_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/partsops-beta --ignore-existing;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env.staging}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env.staging}

  backend-staging:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-partsops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}@postgres:5432/${POSTGRES_DB:-partsops}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      ENABLE_STRICT_TENANT_ENFORCEMENT: ${ENABLE_STRICT_TENANT_ENFORCEMENT:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PARTSOPS_ENV: ${PARTSOPS_ENV:?PARTSOPS_ENV must be set in .env.staging}
      PARTSOPS_AUTH_MODE: ${PARTSOPS_AUTH_MODE:?PARTSOPS_AUTH_MODE must be set in .env.staging}
      PARTSOPS_PHASE_LABEL: ${PARTSOPS_PHASE_LABEL:-Phase 1 — Beta Staging Gate}
      PARTSOPS_CORS_ORIGINS: ${PARTSOPS_CORS_ORIGINS:?PARTSOPS_CORS_ORIGINS must be set in .env.staging}
      PARTSOPS_OIDC_ISSUER: ${PARTSOPS_OIDC_ISSUER:?PARTSOPS_OIDC_ISSUER must be set in .env.staging}
      PARTSOPS_OIDC_AUDIENCE: ${PARTSOPS_OIDC_AUDIENCE:?PARTSOPS_OIDC_AUDIENCE must be set in .env.staging}
      PARTSOPS_OIDC_TENANT_CLAIM: ${PARTSOPS_OIDC_TENANT_CLAIM:-organization_id}
      PARTSOPS_OIDC_ROLE_CLAIM: ${PARTSOPS_OIDC_ROLE_CLAIM:-realm_access.roles}
      PARTSOPS_STORAGE_BACKEND: ${PARTSOPS_STORAGE_BACKEND:?PARTSOPS_STORAGE_BACKEND must be set in .env.staging}
      PARTSOPS_S3_BUCKET: ${PARTSOPS_S3_BUCKET:?PARTSOPS_S3_BUCKET must be set in .env.staging}
      PARTSOPS_S3_PREFIX: ${PARTSOPS_S3_PREFIX:-partsops}
      PARTSOPS_S3_REGION: ${PARTSOPS_S3_REGION:-ru-central1}
      PARTSOPS_S3_ENDPOINT_URL: http://minio:9000
      # The local staging backend must use the same S3 credentials that boot
      # the isolated MinIO instance; do not depend on stale AWS_* values in
      # an inherited developer environment.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env.staging}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env.staging}
      PARTSOPS_OUTBOUND_WEBHOOK_SECRET: ${PARTSOPS_OUTBOUND_WEBHOOK_SECRET:?PARTSOPS_OUTBOUND_WEBHOOK_SECRET must be set in .env.staging}
      PARTSOPS_OUTBOUND_WEBHOOK_TIMEOUT_SECONDS: ${PARTSOPS_OUTBOUND_WEBHOOK_TIMEOUT_SECONDS:-10}
      ERP_WEBHOOK_SECRET: ${ERP_WEBHOOK_SECRET:?ERP_WEBHOOK_SECRET must be set in .env.staging}
      ERPNEXT_URL: ${ERPNEXT_URL:-}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      ERP_DRY_RUN: ${ERP_DRY_RUN:-0}
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      # The browser-visible issuer remains localhost, while backend JWKS
      # verification must use the Docker service hostname.
      PARTSOPS_OIDC_JWKS_URL: http://keycloak:8080/realms/partsops/protocol/openid-connect/certs
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; from settings import settings; settings.validate_auth_configuration(); urlopen(settings.OIDC_JWKS_URL, timeout=3).read(1); urlopen('http://localhost:8000/health', timeout=3).read(1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  pipeline-worker-staging:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: ["python", "-m", "app.automation.pipeline_worker", "--poll-seconds", "1"]
    depends_on:
      backend-staging:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-partsops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}@postgres:5432/${POSTGRES_DB:-partsops}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      ENABLE_STRICT_TENANT_ENFORCEMENT: ${ENABLE_STRICT_TENANT_ENFORCEMENT:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PARTSOPS_ENV: ${PARTSOPS_ENV:?PARTSOPS_ENV must be set in .env.staging}
      PARTSOPS_AUTH_MODE: ${PARTSOPS_AUTH_MODE:?PARTSOPS_AUTH_MODE must be set in .env.staging}
      PARTSOPS_PHASE_LABEL: ${PARTSOPS_PHASE_LABEL:-Phase 1 — Beta Staging Gate}
      PARTSOPS_OIDC_ISSUER: ${PARTSOPS_OIDC_ISSUER:?PARTSOPS_OIDC_ISSUER must be set in .env.staging}
      PARTSOPS_OIDC_AUDIENCE: ${PARTSOPS_OIDC_AUDIENCE:?PARTSOPS_OIDC_AUDIENCE must be set in .env.staging}
      PARTSOPS_OIDC_TENANT_CLAIM: ${PARTSOPS_OIDC_TENANT_CLAIM:-organization_id}
      PARTSOPS_OIDC_ROLE_CLAIM: ${PARTSOPS_OIDC_ROLE_CLAIM:-realm_access.roles}
      PARTSOPS_STORAGE_BACKEND: ${PARTSOPS_STORAGE_BACKEND:?PARTSOPS_STORAGE_BACKEND must be set in .env.staging}
      PARTSOPS_S3_BUCKET: ${PARTSOPS_S3_BUCKET:?PARTSOPS_S3_BUCKET must be set in .env.staging}
      PARTSOPS_S3_PREFIX: ${PARTSOPS_S3_PREFIX:-partsops}
      PARTSOPS_S3_REGION: ${PARTSOPS_S3_REGION:-ru-central1}
      PARTSOPS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env.staging}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env.staging}
      PARTSOPS_OUTBOUND_WEBHOOK_SECRET: ${PARTSOPS_OUTBOUND_WEBHOOK_SECRET:?PARTSOPS_OUTBOUND_WEBHOOK_SECRET must be set in .env.staging}
      PARTSOPS_OUTBOUND_WEBHOOK_TIMEOUT_SECONDS: ${PARTSOPS_OUTBOUND_WEBHOOK_TIMEOUT_SECONDS:-10}
      ERP_WEBHOOK_SECRET: ${ERP_WEBHOOK_SECRET:?ERP_WEBHOOK_SECRET must be set in .env.staging}
      ERPNEXT_URL: ${ERPNEXT_URL:-}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      ERP_DRY_RUN: ${ERP_DRY_RUN:-0}
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      PARTSOPS_PIPELINE_WORKER_ID: staging-pipeline-worker-1

volumes:
  postgres_staging_data:
  minio_staging_data:
