version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: partsops-postgres-test
    environment:
      POSTGRES_DB: partsops_test
      POSTGRES_USER: partsops
      POSTGRES_PASSWORD: partsops_test_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partsops -d partsops_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata-test:/var/lib/postgresql/data

volumes:
  pgdata-test:
